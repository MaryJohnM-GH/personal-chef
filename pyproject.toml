[project]
name = "personal-chef"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mary John", email = "mary.johnm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
    "tavily>=1.1.0",
]

[project.scripts]
personal-chef = "personal_chef:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
